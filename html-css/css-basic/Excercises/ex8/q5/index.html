<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>q5</title>
</head>
<body>
    <h1>Contact us</h1>
    <section>
        
        <br>
        <fieldset>
            <legend>
                Personal information
            </legend>
            <form>
  <label for="name"> Name:</label>
  <input type="text" id="name" name="name"><br><br>
  <label for="email">Email:</label>
  <input type="text" id="email" name="email"><br><br>
  <label for="phone">Phone:</label>
  <input type="text" id="phone" name="phone"><br><br>
</form>
        </fieldset>
             
        
   
</section>
<br>

<section>
        
        <fieldset>
            <legend>Message Details</legend>
            <form>
                <label for="subject">Choose a subject:</label>

<select name="subject" id="subject" multiple>
  <option value="volvo">Volvo</option>
  <option value="saab">Saab</option>
  <option value="opel">Opel</option>
  <option value="audi">Audi</option>
</select>
<br>
<div class="form-group">
                <label>Priority:</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="priority" value="low"> Low
                    </label>
                    <label>
                        <input type="radio" name="priority" value="medium"> Medium
                    </label>
                    <label>
                        <input type="radio" name="priority" value="high"> High
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Your message..."></textarea>
            </div>
</form></fieldset>

    
        
   
</section>
<form>
        <fieldset>
            <legend>Preferences</legend>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="newsletter" value="subscribe"> Subscribe to newsletter
                </label>
            </div>

            <div class="form-group">
                <label for="contact-method">Contact Method: </label>
                <select id="contact-method" name="contact_method">
                    <option value="email">Email</option>
                    <option value="phone">Phone</option>
                    <option value="sms">SMS</option>
                </select>
            </div>
        </fieldset>

        <div class="button-group">
            <input type="submit" value="Send Message">
            <input type="reset" value="Reset">
        </div>
    </form>
    
    
</body>
</html>
