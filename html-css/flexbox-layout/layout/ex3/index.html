<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <header>
           <h1> Contact Form </h1>
           <div class = "minititle">
            Get in Touch with us
            </div>
        </header>
            <div class ="line">
                <div class = "component">
                    <div class = "q">
                        First Name
                    </div>
                    <div class="a">
                        <input type="text" id="last-name" name="lastName">
                    </div>
                </div>
                <div class = "component">
                    <div class = "q">
                        Last Name
                    </div>
                    <div class="a">
                        <input type="text" id="first-name" name="firstName">
                    </div>
                </div>
            </div>
            <div class = "line">
                <div class = "component">
                    <div class = "q">
                        Email Address
                    </div>
                    <div class="a">
                        <input type="text" id="last-name" name="lastName">
                    </div>
                </div>
            </div>
            <div class = "line">
                <div class = "component">
                    <div class="q">Subject</div>
                    <div class="a">
                        <select name="subject">
                            <option value=""disabled selected>Select a topic</option>
                            <option value="support">Technical Support</option>
                            <option value="billing">Billing Inquiry</option>
                            <option value="general">General Question</option>
                        </select>
                    </div>
                </div>

                <div class = "component">
                    <div class="q">Priority</div>
                    <div class="a">
                        <select name="priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

            </div>
            <div class = "line">
                <div class="component">
                    <div class="q">Enter your message here</div>
                    <div class="message">
                        <input type="text" id="message" name="message" placeholder="Enter your message here"></div>
                </div>
            </div>
            <div class = "line">
                <div class = "component">
                    <div class="q">Contact Prferances</div>
                    <div class = "checkbox-container">
                        <div class = "checkbox-item">
                            <label class="checkbox">
                                <input type="checkbox" name="preferences" value="email">Email updates</label>
                        </div>
                        <div class = "checkbox-item">
                            <label class="checkbox">
                                <input type="checkbox" name="preferences" value="phone">Phone Follow up</label>
                        </div>
                        <div class = "checkbox-item">
                            <label class="checkbox">
                                <input type="checkbox" name="preferences" value="newsletter">Newsletter</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="line-buttons">
                <button class="save" type="button">Save Draft</button>
                <button class="send" type="submit">Send Message</button>
            </div>
        
        
    </form>
    
</body>
</html>
